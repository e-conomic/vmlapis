syntax = "proto3";

package asgt.tabicl.v1;

import "asgt/type/data.proto";
import "asgt/type/prediction.proto";
import "validate/validate.proto";

option go_package = "github.com/e-conomic/vmlapis/gen/go/asgt/tabicl/v1;tabicl";

// TabiclService performs in-context tabular classification over a dataset's
// labeled examples.
service TabiclService {
  rpc BatchSuggest(BatchSuggestRequest) returns (BatchSuggestResponse) {}
  // BatchSuggestExamples predicts stored examples from their precomputed product type logits,
  // using the dataset's examples added before them as the support set.
  rpc BatchSuggestExamples(BatchSuggestExamplesRequest) returns (BatchSuggestExamplesResponse) {}
}

message BatchSuggestRequest {
  string dataset_name = 1 [(validate.rules).string = {min_len: 1}];
  string consumer_name = 2 [(validate.rules).string = {min_len: 1}];
  repeated asgt.type.Data inputs = 3 [(validate.rules).repeated = {
    min_items: 1
    max_items: 256
  }];
  int32 suggest_limit = 4 [(validate.rules).int32 = {gt: 0}];
}

message BatchSuggestResponse {
  // One prediction per input, in request order.
  repeated asgt.type.Prediction predictions = 1;
}

message ExampleLogits {
  string example_id = 1 [(validate.rules).string = {min_len: 1}];
  // Product type logits of the example's text, as returned by ProductTypeService.InternalBatchSuggestWithLogits.
  repeated float logits = 2 [(validate.rules).repeated = {min_items: 1}];
}

message BatchSuggestExamplesRequest {
  // Stored examples of one dataset with their precomputed logits.
  repeated ExampleLogits examples = 1 [(validate.rules).repeated = {
    min_items: 1
    max_items: 512
  }];
  int32 suggest_limit = 2 [(validate.rules).int32 = {gt: 0}];
}

message BatchSuggestExamplesResponse {
  // One prediction per example, in request order.
  repeated asgt.type.Prediction predictions = 1;
}
